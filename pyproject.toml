[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-solver"
version = "0.1.0"
description = "Sudoku solving and benchmarking: PySAT AMO encodings, backtracking, OR-Tools CP-SAT"
requires-python = ">=3.11"
dependencies = [
    "python-sat",
    "ortools",
    "matplotlib",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]